[project]
name = "baed"
version = "0.1.0"
description = "Refactored implementation of BAED - Balanced Anomaly-guided Ego-graph Diffusion Model for Inductive Graph Anomaly Detection (KDD 2026)."
readme = "README.md"
requires-python = ">= 3.11"
authors = [
    { name = "Vu Ngoc Duong", email = "vungocduong255@gmail.com" }
]
dependencies = [
    "loguru>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baed"]
include = ["src/baed/.agents/**/*"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-watch>=4.2.0",
    "pre-commit>=3.7.0",
    "ruff>=0.4.0",
    "pyright>=1.1.360",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["E501", "N802", "N803", "N806", "B905", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["baed"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src"]
exclude = ["tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks integration tests requiring external resources",
]
